<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="/src/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo.txt</title>
  </head>
  <body class="app-body">
    <div id="app" class="app-container">
      <header class="app-header">
        <h1 class="app-title">todo.txt</h1>
      </header>

      <main class="app-main">
        <section class="app-controls">
          <div class="control-buttons">
            <button id="load-btn" class="btn btn-load">Load Todos</button>
            <button id="save-btn" class="btn btn-save">Save Todos</button>
          </div>
        </section>

        <section class="app-content">
          <div class="todo-editor-wrapper">
            <textarea 
              id="todo-content" 
              class="todo-editor"
              rows="20"
              cols="80"
              placeholder="Your todos will appear here..."
            ></textarea>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <p class="footer-text">&copy; 2025 todo.txt</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
